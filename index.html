<!DOCTYPE html>
<!--[if lt IE 7]>      <html class="no-js lt-ie9 lt-ie8 lt-ie7"> <![endif]-->
<!--[if IE 7]>         <html class="no-js lt-ie9 lt-ie8"> <![endif]-->
<!--[if IE 8]>         <html class="no-js lt-ie9"> <![endif]-->
<!--[if gt IE 8]>      <html class="no-js"> <!--<![endif]-->
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Electromagnetic Simulator</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <!--[if lt IE 7]>
            <p class="browsehappy">You are using an <strong>outdated</strong> browser. Please <a href="#">upgrade your browser</a> to improve your experience.</p>
        <![endif]-->
    <div>
        <div class="border">
            <input style="width:50vw;" id="THETA" type="text" value="0.1-2 range value for performance and accuracy">
            <button id="enterTHETA">Enter Theta</button>
        </div>
        <div class="border">
            <input style="width:50vw;" id="PMAX" type="text" value="Amount of Particles in each Space Partition">
            <button id="enterPMAX">Enter Particles Amount Per Partition</button>
        </div>
        <div class="border">
            <input style="width:50vw;" id="PAMOUNT" type="text" value="Total Amount of Particles">
            <button id="enterPAMOUNT">Enter Particles Amount</button>
        </div>
        
        <div class="border">
            <label>Mean of distribution of particles along an axis</label>
            <input id="magnetMean" type="number" value="0">
            <label>Standard deviation of particles from mean</label>
            <input id="magnetStdDev" type="number" value="5">
            <label>Axis (x, y, z) to apply magnet:</label>
            <input id="magnetAxis" type="text" value="x">
            <label>Random range for other Axes:</label>
            <input id="magnetOthers" type="number" value="0.5">
            <button id="magnetEnter">Enter Magnet Preset</button>
        </div>
        <div class="border">
            <label>Side length of cube: </label>
            <input id="cube" type="number" value="10">
            <button id="cubeEnter">Enter Length</button>
        </div>
        <div class="border">
            <label>Electrostatic:</label>
            <button id="electrostaticEnter">Apply Electrostatic</button>
            <label>Magnetostatic:</label>
            <button id="magnetostaticEnter">Apply Magnetostatic</button>
        </div>
        <div class="border">
            <label>Constant electric field:</label>
            <input id="constantEx" type="number" value="0" style="width:6vw;">
            <input id="constantEy" type="number" value="0" style="width:6vw;">
            <input id="constantEz" type="number" value="0" style="width:6vw;">
            <button id="constantEEnter">Apply Constant E</button>
        </div>
        <div class="border">
            <label>Constant magnetic field:</label>
            <input id="constantMx" type="number" value="0" style="width:6vw;">
            <input id="constantMy" type="number" value="1" style="width:6vw;">
            <input id="constantMz" type="number" value="0" style="width:6vw;">
            <button id="constantMEnter">Apply Constant M</button>
        </div>
        <div class="border">
            <button id="toroidalEnter">Apply Toroidal Ring</button>
        </div>
        <div class="border">
            <lablel>On: </lablel>
            <input id="vectorsOn" type="text" value="false">
            <label>See Electric Fields</label>
            <input id="vectorsE" type="text" value="true">
            <label>See Magnetic Fields</label>
            <input id="vectorsM" type="text" value="true">
            <label>Range of Vectors:</label>
            <input id="vectorsR" type="number" value="2">
            <label>Distant between Vectors:</label>
            <input id="vectorsD" type="number" value="0.4">
            <label>Speed per Frame:</label>
            <input id="vectorsS" type="number" value="0.01">
            <label>Big O Time Type (nn or nlogn):</label>
            <input id="vectorsO" type="text" value="nlogn">
            <button id="vectorsEnter">Enter Vector Info</button>
        </div>
        <div class="border">
            <button id="RESET">Reset</button>
            <button id="PAUSE">Pause</button>
        </div>
    </div>
    <canvas id="simulation"></canvas>
    <script src="main.js" type="module" async defer></script>

    <script src="https://cdn.jsdelivr.net/npm/mathjs@11/lib/browser/math.js"></script>
</body>

</html>
